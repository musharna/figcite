version: 2
updates:
  # No github-actions entry: this repo's only workflows are template-owned
  # (repo-template); their pins are bumped there and arrive by resync. Excluding
  # both leaves Dependabot nothing to read, and it fails the run.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      pip-minor-patch:
        update-types: ["minor", "patch"]
