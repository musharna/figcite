[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "figcite"
version = "0.2.1"
description = "Keep DOI/citation provenance attached to images from capture through to your slides"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pillow>=10",
    "python-pptx>=0.6.21",
    "PyMuPDF>=1.23",
    "requests>=2.28",
]

# Kept OUT of the base install deliberately. opencv is an order of magnitude
# larger than everything above it combined, and it earns its place only when
# you want to identify a figure from a crop of it. Without it figcite still
# matches whole and rescaled figures via dhash, and says so rather than
# reporting a crop as "not found".
[project.optional-dependencies]
match = [
    "opencv-python-headless>=4.8",
    "numpy>=1.24",
]

[project.scripts]
figcite = "figcite.cli:main"

[tool.setuptools.packages.find]
include = ["figcite*"]

[tool.setuptools.package-data]
figcite = ["*.ps1"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
# E501: prose-heavy comments and test docstrings run long on purpose.
ignore = ["E501"]

[tool.pyright]
include = ["figcite"]
pythonVersion = "3.10"
typeCheckingMode = "standard"
