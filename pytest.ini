[pytest]
# --strict-markers: an unregistered marker is an ERROR, not a warning.
# Without it `@pytest.mark.livee` (or any typo) is silently accepted, the test
# is NOT deselected by `-m "not live"`, and it runs inside the push gate --
# where, if it touches the network, it fails for reasons unrelated to the
# code. That is not hypothetical here: the network guard was already
# defeatable, and this is the other way a test can end up online in a
# "not live" run.
#
# `-m "not live"` IS THE DEFAULT, and that is a safety property rather than a
# convenience. `tests/test_pptx_powerpoint.py` does
#
#     New-Object -ComObject PowerPoint.Application ... $ppt.Quit()
#
# and that COM object is the RUNNING PowerPoint, not a private one. `.Quit()`
# closes every open presentation on the machine, including whatever the person
# at the keyboard has not saved, and it leaves NO crash event because nothing
# crashed -- the application was asked to exit.
#
# This machine is someone's live workstation. The push gate always passed
# `-m "not live"` and was safe; a bare `pytest` was not, and a bare `pytest` is
# what anyone types. The destructive tests were OPT-OUT when they needed to be
# OPT-IN, and that difference cost the user unsaved work twice in one day.
#
# Run them deliberately with `pytest -m live`, on a machine where closing
# PowerPoint costs nothing, and not while someone is using it.
addopts = --strict-markers -m "not live"
markers =
    live: DRIVES REAL DESKTOP APPS AND MAY CLOSE THEM -- opt in with `-m live`
    slow: re-runs the whole suite in a subprocess (tests/test_equivalence_registry.py)
